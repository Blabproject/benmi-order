[package]
name = "pricing-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pricing-core = { path = "../pricing-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
rust_decimal = { version = "1.36", features = ["serde-float"] }
rust_decimal_macros = "1.36"
