<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blab 美食探索 | 多店家線上點餐平台</title>
  <meta name="description" content="探索全台 Blab 平台合作優質餐廳、越式法國麵包、台式小吃、點心炸物，支援地圖導航、GPS 距離計算與即時線上點餐。">

  <!-- Open Graph / Social Meta -->
  <meta property="og:title" content="Blab 美食探索 | 線上點餐與地圖導航">
  <meta property="og:description" content="一站式探索附近美食店家，即時查看營業狀態與線上點餐。">
  <meta property="og:type" content="website">

  <!-- MapLibre GL JS Vector Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <script>
    // Seamless routing: If arriving with ?tenant= or ?tenant_id=, forward directly to store menu
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.has('tenant') || params.has('tenant_id') || params.has('liff.state')) {
          window.location.replace('/index.html' + window.location.search + window.location.hash);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="marketplace-root">
    <main class="marketplace-main" data-view="list">
      <section class="stores-panel" aria-label="Stores List">
        <div class="stores-summary-bar">
          <span class="stores-count-badge" id="storesCountBadge" aria-live="polite">載入店家資料中...</span>
        </div>
      </section>
    </main>
  </div>

  <!-- MapLibre GL JS Vector Map CDN -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- React + Vite Marketplace Entry -->
  <script type="module" src="/frontend/apps/marketplace/main.tsx"></script>
</body>

</html>
